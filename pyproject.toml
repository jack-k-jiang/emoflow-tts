[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name="emoflow-tts"
version='0.0.1'
requires-python = ">=3.10,<3.12"
dependencies=[
    "torch",
    "torchaudio",
    "pydantic",
    "pyyaml",
    "pandas",
    "numpy<2",
    "openai-whisper",
    "speechbrain",
    "jiwer",
    "scikit-learn",
    "librosa"
]
authors = [
    {name = "Jack Jiang"}
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
markers = [
    "integration: model-heavy tests that need a real checkpoint/GPU, excluded from default CI run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]    # pyflakes, pycodestyle, import sort, pyupgrade


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true     # speechbrain/whisper/librosa have no type stubs
warn_unused_ignores = true